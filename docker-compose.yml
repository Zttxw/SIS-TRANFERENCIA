services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sis_transferencia_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    networks:
      - sis_network
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: sis_transferencia_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sis_network
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: sis_transferencia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sis_transferencia}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sis_network

networks:
  sis_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
