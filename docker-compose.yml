services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sis_transferencia_backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-sis_transferencia}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
      - ./storage-secure:/var/www/html/storage/secure-evidence
    networks:
      - sis_network
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    container_name: sis_transferencia_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - sis_network

  web:
    image: nginx:alpine
    container_name: sis_transferencia_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend/public:/var/www/html/backend/public:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sis_network
    depends_on:
      - backend
      - frontend

  db:
    image: postgres:16-alpine
    container_name: sis_transferencia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sis_transferencia}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    # Publicado en 55432 del host para no colisionar con el PostgreSQL local
    # (puerto 5432 ocupado). La ingesta desde el host (requiere pdo_sqlsrv)
    # escribe en este puerto; el backend en contenedor usa db:5432 interno.
    ports:
      - "${DB_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sis_network

networks:
  sis_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
